<!DOCTYPE html>
<html lang="es">
<link rel="icon" type="image/png" href="favicon.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acosta Logística Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; }
        .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); }
        .flete-local { background-color: #9ae6b4; color: #1c4532; border-left: 4px solid #48bb78; }
        .flete-foraneo { background-color: #4fd1c5; color: #134e4a; border-left: 4px solid #38b2ac; }
    </style>
</head>
<body class="text-slate-200 p-4 lg:p-8">
    <div class="max-w-7xl mx-auto">
        <header class="flex flex-col md:flex-row justify-between items-center mb-8 gap-4">
            <div>
                <h1 class="text-3xl font-extrabold tracking-tighter text-white">ACOSTA <span class="text-orange-500">LOGÍSTICA</span></h1>
                <p class="text-slate-400 text-sm">Panel de Control de Flota y Reservas</p>
            </div>
            <div class="flex gap-4">
                <div class="glass p-3 rounded-lg text-center min-w-[120px]">
                    <p class="text-[10px] uppercase text-slate-400">Gasolina Hoy</p>
                    <p class="text-xl font-bold text-green-400">$25.00</p>
                </div>
                <div class="glass p-3 rounded-lg text-center min-w-[120px]">
                    <p class="text-[10px] uppercase text-slate-400">Chofer</p>
                    <p class="text-xl font-bold text-orange-400">EN TURNO</p>
                </div>
            </div>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <div class="lg:col-span-1 space-y-6">
                <section class="glass p-6 rounded-2xl">
                    <h2 class="text-lg font-bold mb-4 flex items-center gap-2">
                        <span class="w-2 h-6 bg-orange-500 rounded-full"></span> Nueva Programación
                    </h2>
                    <div class="space-y-4">
                        <div>
                            <label class="text-xs text-slate-400 ml-1">Factura / Descripción</label>
                            <input id="factura" type="text" placeholder="Ej: PA5215" class="w-full bg-slate-800 border-none rounded-lg p-3 mt-1 focus:ring-2 focus:ring-orange-500 outline-none">
                        </div>
                        <div class="grid grid-cols-2 gap-4">
                            <div>
                                <label class="text-xs text-slate-400 ml-1">Peso (kg)</label>
                                <input id="peso" type="number" placeholder="2734" class="w-full bg-slate-800 border-none rounded-lg p-3 mt-1 outline-none">
                            </div>
                            <div>
                                <label class="text-xs text-slate-400 ml-1">Distancia (km)</label>
                                <input id="km" type="number" placeholder="50" class="w-full bg-slate-800 border-none rounded-lg p-3 mt-1 outline-none">
                            </div>
                        </div>
                        <div>
                            <label class="text-xs text-slate-400 ml-1">Vehículo</label>
                            <select id="vehiculo" class="w-full bg-slate-800 border-none rounded-lg p-3 mt-1 outline-none">
                                <option value="7">Nissan NP300 (1.2T)</option>
                                <option value="2.5">Ford F450 (4T)</option>
                            </select>
                        </div>
                        <div class="p-4 bg-orange-500/10 border border-orange-500/20 rounded-xl text-center">
                            <p class="text-xs text-orange-300 uppercase font-bold">Cotización Sugerida (+IVA)</p>
                            <p id="preview-precio" class="text-4xl font-black text-white">$0.00</p>
                        </div>
                        <button onclick="agendarFlete()" class="w-full bg-orange-600 hover:bg-orange-500 text-white font-bold py-4 rounded-xl shadow-lg shadow-orange-900/20 transition-all active:scale-95">
                            CONFIRMAR Y AGENDAR
                        </button>
                    </div>
                </section>
            </div>

            <div class="lg:col-span-2">
                <section class="glass rounded-2xl overflow-hidden">
                    <div class="bg-slate-800/50 p-4 border-b border-white/5 flex justify-between items-center">
                        <h3 class="font-bold">Horarios de Entrega</h3>
                        <div class="flex gap-2 text-[10px]">
                            <span class="flex items-center gap-1"><span class="w-2 h-2 rounded-full bg-[#9ae6b4]"></span> LOCAL</span>
                            <span class="flex items-center gap-1"><span class="w-2 h-2 rounded-full bg-[#4fd1c5]"></span> FORÁNEO</span>
                        </div>
                    </div>
                    <div class="overflow-x-auto">
                        <table class="w-full border-collapse">
                            <thead>
                                <tr class="text-[10px] text-slate-500 border-b border-white/5 uppercase tracking-widest">
                                    <th class="p-4 text-left">Hora</th>
                                    <th class="p-4 border-l border-white/5">F450 (4T)</th>
                                    <th class="p-4 border-l border-white/5">FLETERA</th>
                                    <th class="p-4 border-l border-white/5">NISSAN (1.2T)</th>
                                </tr>
                            </thead>
                            <tbody id="tabla-body">
                                </tbody>
                        </table>
                    </div>
                </section>
            </div>
        </div>
    </div>

    <script>
        const SB_URL = 'https://xmbfgzlkdsrkpsixrjej.supabase.co';
        const SB_KEY = 'sb_publishable_NLKBX_mPJPlyaiXJ1iMDaw_V03kg_TU_COMPLEMENTO'; // Pon tu key completa aquí
        const _supabase = supabase.createClient(SB_URL, SB_KEY);

        // Generar tabla de 07:00 a 18:30
        const horas = ["07:00", "08:00", "09:00", "10:00", "11:00", "12:00", "13:00", "14:00", "15:00", "16:00", "17:00", "18:00"];
        const body = document.getElementById('tabla-body');
        
        horas.forEach(h => {
            body.innerHTML += `
                <tr class="border-b border-white/5 h-16 group hover:bg-white/5 transition">
                    <td class="p-2 text-xs font-mono text-slate-500 text-center bg-slate-800/20">${h}</td>
                    <td id="f450-${h}" class="p-1 border-l border-white/5 relative"></td>
                    <td id="flet-${h}" class="p-1 border-l border-white/5 relative"></td>
                    <td id="niss-${h}" class="p-1 border-l border-white/5 relative"></td>
                </tr>
            `;
        });

        // Lógica de cálculo Acosta
        document.querySelectorAll('input, select').forEach(el => {
            el.addEventListener('input', () => {
                const km = document.getElementById('km').value || 0;
                const rend = document.getElementById('vehiculo').value;
                const margen = document.getElementById('margen').value;
                
                const costoBase = (km / rend) * 25;
                const final = (costoBase / (1 - margen)) * 1.16;
                document.getElementById('preview-precio').innerText = `$${final.toFixed(2)}`;
            });
        });

        async function agendarFlete() {
            // Aquí va la función para insertar en Supabase
            alert("¡Flete programado exitosamente!");
        }
    </script>
</body>
</html>
